<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adventure — Frame port of Colossal Cave</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      #cca-main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 380px;
        gap: 16px;
        padding: 0 16px 16px;
        align-items: start;
      }
      #terminal {
        display: flex;
        flex-direction: column;
        height: 72vh;
        min-height: 420px;
        background: #0b0e14;
        border: 1px solid #2b3242;
        border-radius: 8px;
        overflow: hidden;
      }
      #log {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 14px 16px;
        font-family: "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 14px;
        line-height: 1.45;
        color: #cdd6e6;
      }
      #log .echo { color: #6cae7a; margin-top: 6px; }
      #log .line { white-space: pre-wrap; }
      #cmd-row {
        display: flex;
        align-items: center;
        gap: 8px;
        border-top: 1px solid #2b3242;
        padding: 8px 12px;
        background: #11151f;
      }
      #cmd-row .prompt { color: #6cae7a; font-family: monospace; }
      #cmd {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: #e6e1e8;
        font-family: monospace;
        font-size: 14px;
        padding: 4px 0;
      }
      #cca-panel #viz {
        width: 100%;
        min-height: 320px;
        background: #0b0e14;
        border: 1px solid #2b3242;
        border-radius: 8px;
        padding: 8px;
      }
      #cca-panel .meta { margin: 6px 2px; }
      /* glowing live-state node, matching the arcade chart */
      #viz g.node.active ellipse,
      #viz g.node.active polygon { fill: #1f6f43; stroke: #6cf0a0; stroke-width: 2; }
      #viz g.node.active text { fill: #eafff1; }
      @media (max-width: 820px) {
        #cca-main { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Adventure</h1>
      <p>
        <em>Colossal Cave Adventure</em> (Crowther &amp; Woods, 1977),
        reimplemented as <strong>Frame state machines</strong> — the same
        <code>.fjs</code> specs that power the arcade. The chart shows the live
        <code>Adventure</code> state as you play.
      </p>
      <nav id="menu"><a class="tab" href="/index.html">&larr; Arcade</a></nav>
    </header>
    <main>
      <div id="cca-main">
        <div id="terminal">
          <div id="log"></div>
          <div id="cmd-row">
            <span class="prompt">&gt;</span>
            <input
              id="cmd"
              type="text"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="LOOK · N/S/E/W · TAKE KEYS · ON · XYZZY · SCORE · HELP"
            />
          </div>
        </div>
        <aside id="cca-panel">
          <p class="meta" id="score">score 0</p>
          <div id="viz" aria-label="Live Frame state chart"></div>
        </aside>
      </div>
    </main>
    <script type="module" src="/src/cca/cca-main.ts"></script>
  </body>
</html>
