<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frame Arcade</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Frame Arcade</h1>
      <p>
        Each game's logic is a <strong>Frame state machine</strong>. The chart on
        the right is generated from the same <code>.fjs</code> spec — the glowing
        node is the machine's live state as you play.
      </p>
      <nav id="menu"></nav>
      <p class="meta">
        Also: <a href="/cca.html">Colossal Cave Adventure</a> — the same Frame
        approach as a full text adventure (~28 composed state machines).
      </p>
    </header>
    <main>
      <div id="stage">
        <div id="game"></div>
        <p id="controls" class="meta"></p>
      </div>
      <aside id="panel">
        <p id="teaches" class="meta"></p>
        <div id="viz" aria-label="Live Frame state chart"></div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
